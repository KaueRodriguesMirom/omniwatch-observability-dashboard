<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniWatch - Enterprise Observability</title>
  
  <!-- Tailwind CSS para o Design -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            vivo: { purple: '#660099', pink: '#E6007E' },
            slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' }
          },
          animation: {
            'radar': 'radar 2s linear infinite',
            'slide-in': 'slideIn 0.3s ease-out forwards',
          },
          keyframes: {
            radar: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' }
            },
            slideIn: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- Fonte Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Custom Scrollbar -->
  <style>
    body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .glass-panel {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.15); }
    .glow-rose { box-shadow: 0 0 20px rgba(225, 29, 72, 0.15); }
  </style>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen relative selection:bg-cyan-500/30">
  
  <!-- Background Decorativo -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-cyan-900/10 blur-[120px]"></div>
    <div class="absolute top-[60%] -right-[10%] w-[40%] h-[60%] rounded-full bg-blue-900/10 blur-[120px]"></div>
  </div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icons = {
      Activity: (props) => <svg {...props} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
      Server: (props) => <svg {...props} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><rect x="2" y="2" width="20" height="8" rx="2" ry="2" /><rect x="2" y="14" width="20" height="8" rx="2" ry="2" /><line x1="6" y1="6" x2="6.01" y2="6" /><line x1="6" y1="18" x2="6.01" y2="18" /></svg>,
      Wifi: (props) => <svg {...props} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12 18.75h.007v.008H12v-.008z" /></svg>,
      Database: (props) => <svg {...props} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /></svg>,
      Alert: (props) => <svg {...props} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
      Close: (props) => <svg {...props} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>,
      Refresh: (props) => <svg {...props} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
      CheckCircle: (props) => <svg {...props} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
    };

    const INITIAL_SERVICES = [
      { id: 'srv-01', name: 'Core 5G - SP Principal', type: 'network', latency: 12, status: 'online', uptime: '99.99%', cpu: 45, ram: 60, region: 'us-east-1' },
      { id: 'srv-02', name: 'Gateway de Faturamento', type: 'api', latency: 45, status: 'online', uptime: '99.95%', cpu: 65, ram: 78, region: 'sa-east-1' },
      { id: 'srv-03', name: 'CRM Oracle - DB Cluster', type: 'database', latency: 120, status: 'degraded', uptime: '98.50%', cpu: 92, ram: 88, region: 'sa-east-1' },
      { id: 'srv-04', name: 'Provisionamento OLT Fibra', type: 'api', latency: 25, status: 'online', uptime: '99.90%', cpu: 30, ram: 45, region: 'sa-east-1' },
      { id: 'srv-05', name: 'Radius SSO (Autenticação)', type: 'server', latency: 300, status: 'offline', uptime: '95.00%', cpu: 0, ram: 0, region: 'us-east-1' },
      { id: 'srv-06', name: 'BGP Edge Router', type: 'network', latency: 8, status: 'online', uptime: '100%', cpu: 15, ram: 25, region: 'sa-east-1' },
      { id: 'srv-07', name: 'Microsserviço de SMS', type: 'api', latency: 35, status: 'online', uptime: '99.8%', cpu: 40, ram: 50, region: 'us-west-1' },
      { id: 'srv-08', name: 'Redis Cache Layer', type: 'database', latency: 5, status: 'online', uptime: '99.99%', cpu: 20, ram: 70, region: 'sa-east-1' },
    ];

    const ProgressBar = ({ label, value, colorClass }) => (
      <div className="mb-4">
        <div className="flex justify-between text-xs mb-1">
          <span className="text-slate-400 font-medium">{label}</span>
          <span className="text-slate-200">{value}%</span>
        </div>
        <div className="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
          <div className={`h-2 rounded-full ${colorClass} transition-all duration-500`} style={{ width: `${value}%` }}></div>
        </div>
      </div>
    );

    const StatusBadge = ({ status }) => {
      const config = {
        online: { bg: 'bg-emerald-500/10', text: 'text-emerald-400', border: 'border-emerald-500/20', label: 'Operacional', dot: 'bg-emerald-400' },
        degraded: { bg: 'bg-amber-500/10', text: 'text-amber-400', border: 'border-amber-500/20', label: 'Degradado', dot: 'bg-amber-400' },
        offline: { bg: 'bg-rose-500/10', text: 'text-rose-400', border: 'border-rose-500/20', label: 'Incidente Crítico', dot: 'bg-rose-400' },
      }[status];

      return (
        <span className={`inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium border ${config.bg} ${config.text} ${config.border}`}>
          <span className="relative flex h-2 w-2 mr-2">
            {status !== 'offline' && <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${config.dot}`}></span>}
            <span className={`relative inline-flex rounded-full h-2 w-2 ${config.dot}`}></span>
          </span>
          {config.label}
        </span>
      );
    };

    function OmniWatchApp() {
      const [services, setServices] = useState(INITIAL_SERVICES);
      const [activeFilter, setActiveFilter] = useState('all'); // all, network, api, database
      const [selectedService, setSelectedService] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [historyLine, setHistoryLine] = useState(Array.from({ length: 30 }, () => Math.floor(Math.random() * 50) + 10));

      // Simulador de Tempo Real
      useEffect(() => {
        const interval = setInterval(() => {
          setServices(current =>
            current.map(svc => {
              if (svc.status === 'offline') return svc;
              
              let baseLatency = svc.type === 'network' ? 10 : svc.type === 'api' ? 40 : 80;
              let newLatency = baseLatency + Math.floor(Math.random() * 30) - 10;
              let newCpu = svc.cpu + (Math.floor(Math.random() * 10) - 5);
              let newRam = svc.ram + (Math.floor(Math.random() * 6) - 3);
              
              // Limites
              newCpu = Math.min(Math.max(newCpu, 5), 98);
              newRam = Math.min(Math.max(newRam, 10), 95);
              
              let newStatus = svc.status;
              // Anomalias aleatórias
              if (Math.random() > 0.96 && svc.id !== 'srv-01') {
                 newStatus = 'degraded';
                 newLatency += 150;
                 newCpu = 95;
              } else if (svc.status === 'degraded' && Math.random() > 0.7) {
                 newStatus = 'online';
              }

              return { ...svc, latency: Math.max(newLatency, 1), status: newStatus, cpu: newCpu, ram: newRam };
            })
          );
          
          setHistoryLine(prev => [...prev.slice(1), Math.floor(Math.random() * 80) + 20]);
        }, 3000);
        return () => clearInterval(interval);
      }, []);

      const showToast = (message, type = 'success') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      const handleRestartService = (serviceId) => {
        showToast(`Comando de restart enviado para ${services.find(s => s.id === serviceId).name}`, 'info');
        // Simula o restart visualmente
        setTimeout(() => {
          setServices(current => current.map(s => {
            if (s.id === serviceId) return { ...s, status: 'online', cpu: 15, ram: 20, latency: 15 };
            return s;
          }));
          showToast('Serviço restaurado com sucesso!', 'success');
        }, 2000);
      };

      const filteredServices = useMemo(() => {
        if (activeFilter === 'all') return services;
        return services.filter(s => s.type === activeFilter);
      }, [services, activeFilter]);

      const stats = {
        total: services.length,
        online: services.filter(s => s.status === 'online').length,
        issues: services.filter(s => s.status !== 'online').length,
        avgLatency: Math.floor(services.reduce((acc, curr) => acc + curr.latency, 0) / services.length)
      };

      const getIcon = (type) => {
        const iconMap = { network: Icons.Wifi, api: Icons.Activity, database: Icons.Database, server: Icons.Server };
        return iconMap[type] || Icons.Server;
      };

      return (
        <div className="min-h-screen p-4 sm:p-6 lg:p-8 flex flex-col">
          
          {/* Header */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 glass-panel p-4 sm:px-6 rounded-2xl glow-cyan">
            <div className="flex items-center gap-4">
              <div className="relative p-3 bg-gradient-to-br from-cyan-600 to-blue-700 rounded-xl shadow-lg">
                <Icons.Activity className="w-7 h-7 text-white relative z-10" />
                <div className="absolute inset-0 bg-cyan-400 blur-md opacity-40 rounded-xl"></div>
              </div>
              <div>
                <h1 className="text-2xl font-bold text-white tracking-tight">OmniWatch <span className="text-cyan-400 text-sm font-normal ml-2 px-2 py-0.5 bg-cyan-950 rounded border border-cyan-800">Enterprise</span></h1>
                <p className="text-slate-400 text-sm">NOC & SRE Observability Platform</p>
              </div>
            </div>
            
            <div className="flex items-center gap-6">
              <div className="flex flex-col text-right">
                <span className="text-xs text-slate-500 uppercase tracking-wider font-semibold">Status Global</span>
                <div className="flex items-center justify-end gap-2 text-sm text-emerald-400 font-medium">
                  <span className="relative flex h-2.5 w-2.5">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                  </span>
                  Todos Sistemas Operacionais
                </div>
              </div>
              <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center overflow-hidden">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=VivoNOC&backgroundColor=1e293b" alt="User" className="w-full h-full" />
              </div>
            </div>
          </header>

          {/* Cards Principais */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div className="glass-panel p-5 rounded-xl border-l-4 border-l-emerald-500 relative overflow-hidden group">
              <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><Icons.CheckCircle className="w-16 h-16" /></div>
              <h3 className="text-slate-400 text-sm font-medium mb-1">Health Score</h3>
              <div className="text-3xl font-bold text-white">{Math.round((stats.online / stats.total) * 100)}<span className="text-xl text-slate-500">%</span></div>
            </div>
            
            <div className={`glass-panel p-5 rounded-xl border-l-4 relative overflow-hidden group ${stats.issues > 0 ? 'border-l-rose-500 glow-rose' : 'border-l-slate-700'}`}>
              <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><Icons.Alert className="w-16 h-16" /></div>
              <h3 className="text-slate-400 text-sm font-medium mb-1">Incidentes Abertos</h3>
              <div className="text-3xl font-bold text-white flex items-center gap-3">
                {stats.issues}
                {stats.issues > 0 && <span className="text-xs bg-rose-500/20 text-rose-400 px-2 py-1 rounded-md border border-rose-500/30">Atenção Requerida</span>}
              </div>
            </div>

            <div className="glass-panel p-5 rounded-xl border-l-4 border-l-cyan-500 relative overflow-hidden group">
              <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><Icons.Wifi className="w-16 h-16" /></div>
              <h3 className="text-slate-400 text-sm font-medium mb-1">Latência Média (Global)</h3>
              <div className="text-3xl font-bold text-white">{stats.avgLatency} <span className="text-xl text-slate-500">ms</span></div>
            </div>

            {/* Gráfico de Tráfego Simulado */}
            <div className="glass-panel p-5 rounded-xl flex flex-col justify-between">
              <h3 className="text-slate-400 text-sm font-medium mb-2 flex justify-between">
                Tráfego em Tempo Real
                <span className="text-cyan-400 text-xs flex items-center"><span className="w-1.5 h-1.5 rounded-full bg-cyan-400 mr-1 animate-pulse"></span> Ao Vivo</span>
              </h3>
              <div className="flex items-end gap-[2px] h-12 w-full mt-auto">
                {historyLine.map((val, idx) => (
                  <div key={idx} className="bg-gradient-to-t from-cyan-600/50 to-cyan-400 flex-1 rounded-t-sm transition-all duration-300 opacity-80" style={{ height: `${val}%` }}></div>
                ))}
              </div>
            </div>
          </div>

          {/* Área Principal: Filtros e Tabela */}
          <div className="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 relative">
            
            {/* Tabela de Serviços */}
            <div className="lg:col-span-2 flex flex-col gap-4">
              {/* Filtros */}
              <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                {[
                  { id: 'all', label: 'Todos os Recursos' },
                  { id: 'network', label: 'Infra de Rede' },
                  { id: 'api', label: 'APIs & Gateways' },
                  { id: 'database', label: 'Bancos de Dados' }
                ].map(f => (
                  <button 
                    key={f.id} 
                    onClick={() => setActiveFilter(f.id)}
                    className={`px-4 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap ${
                      activeFilter === f.id 
                      ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50 shadow-[0_0_10px_rgba(6,182,212,0.2)]' 
                      : 'bg-slate-800/50 text-slate-400 border border-transparent hover:bg-slate-700/50'
                    }`}
                  >
                    {f.label}
                  </button>
                ))}
              </div>

              {/* Tabela Glassmorphism */}
              <div className="glass-panel rounded-xl overflow-hidden border border-slate-700/50 shadow-2xl">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm whitespace-nowrap">
                    <thead className="bg-slate-900/80 border-b border-slate-700/50">
                      <tr>
                        <th className="px-6 py-4 text-slate-400 font-medium">Microsserviço / Nó</th>
                        <th className="px-6 py-4 text-slate-400 font-medium">Status Atual</th>
                        <th className="px-6 py-4 text-slate-400 font-medium">Métricas (Ping)</th>
                        <th className="px-6 py-4 text-slate-400 font-medium text-right">Ação</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/50">
                      {filteredServices.map(service => {
                        const Icon = getIcon(service.type);
                        const isSelected = selectedService?.id === service.id;
                        return (
                          <tr 
                            key={service.id} 
                            onClick={() => setSelectedService(service)}
                            className={`transition-all cursor-pointer hover:bg-slate-800/40 ${isSelected ? 'bg-slate-800/60 border-l-2 border-l-cyan-400' : 'border-l-2 border-l-transparent'}`}
                          >
                            <td className="px-6 py-4">
                              <div className="flex items-center gap-4">
                                <div className={`p-2.5 rounded-lg ${isSelected ? 'bg-cyan-500/20 text-cyan-400' : 'bg-slate-800 text-slate-400'}`}>
                                  <Icon className="w-5 h-5" />
                                </div>
                                <div>
                                  <div className="font-semibold text-slate-200">{service.name}</div>
                                  <div className="text-xs text-slate-500">{service.region}</div>
                                </div>
                              </div>
                            </td>
                            <td className="px-6 py-4"><StatusBadge status={service.status} /></td>
                            <td className="px-6 py-4">
                              <div className="flex flex-col gap-1">
                                <span className={`font-mono text-sm ${service.latency > 150 ? 'text-rose-400' : service.latency > 80 ? 'text-amber-400' : 'text-slate-300'}`}>
                                  {service.latency} ms
                                </span>
                              </div>
                            </td>
                            <td className="px-6 py-4 text-right">
                              <button className="text-slate-400 hover:text-cyan-400 px-3 py-1 rounded border border-transparent hover:border-cyan-500/30 hover:bg-cyan-500/10 transition-all text-xs font-medium">
                                Detalhes
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  {filteredServices.length === 0 && (
                     <div className="p-8 text-center text-slate-500">Nenhum serviço encontrado para este filtro.</div>
                  )}
                </div>
              </div>
            </div>

            {/* Painel Direito (Alertas e Detalhes) */}
            <div className="flex flex-col gap-6">
              
              {/* Radar Decorativo */}
              <div className="glass-panel rounded-xl p-6 border border-slate-700/50 flex flex-col items-center justify-center relative overflow-hidden h-48">
                 <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(6,182,212,0.1)_0%,transparent_70%)]"></div>
                 <div className="w-24 h-24 rounded-full border border-cyan-500/30 flex items-center justify-center relative">
                    <div className="absolute inset-0 rounded-full border border-cyan-400/20 scale-150"></div>
                    <div className="absolute inset-0 rounded-full border border-cyan-400/10 scale-110"></div>
                    {/* Scanner */}
                    <div className="absolute w-[120%] h-1 bg-cyan-400/50 shadow-[0_0_15px_#22d3ee] top-1/2 left-[-10%] origin-center animate-radar"></div>
                    <Icons.Server className="w-8 h-8 text-cyan-400 z-10" />
                 </div>
                 <p className="mt-6 text-sm font-medium text-cyan-400 tracking-widest uppercase">Escaneamento Contínuo</p>
              </div>

              {/* Log de Alertas */}
              <div className="glass-panel rounded-xl border border-slate-700/50 flex flex-col flex-1 max-h-[400px]">
                <div className="px-5 py-4 border-b border-slate-700/50 bg-slate-800/30">
                  <h2 className="text-base font-semibold text-white flex items-center gap-2">
                    <Icons.Alert className="w-4 h-4 text-amber-400" /> Eventos do Sistema
                  </h2>
                </div>
                <div className="p-4 overflow-y-auto space-y-3">
                  {services.filter(s => s.status !== 'online').length > 0 ? (
                    services.filter(s => s.status !== 'online').map(alert => (
                      <div key={`alert-${alert.id}`} className={`p-3 rounded-lg border-l-4 bg-slate-900/50 flex flex-col gap-2 ${alert.status === 'offline' ? 'border-rose-500' : 'border-amber-500'}`}>
                        <div className="flex justify-between items-start">
                          <span className={`text-sm font-semibold ${alert.status === 'offline' ? 'text-rose-400' : 'text-amber-400'}`}>
                            {alert.status === 'offline' ? 'CRÍTICO' : 'AVISO'}
                          </span>
                          <span className="text-[10px] text-slate-500 font-mono">Agora</span>
                        </div>
                        <p className="text-xs text-slate-300">
                          <span className="font-semibold text-white">{alert.name}</span> apresenta anomalia. Latência: {alert.latency}ms.
                        </p>
                        {alert.status === 'offline' && (
                          <button onClick={() => handleRestartService(alert.id)} className="mt-1 text-left text-xs text-cyan-400 hover:text-cyan-300 hover:underline inline-flex items-center gap-1">
                            <Icons.Refresh className="w-3 h-3" /> Reiniciar Instância
                          </button>
                        )}
                      </div>
                    ))
                  ) : (
                    <div className="flex flex-col items-center justify-center text-slate-500 py-8 gap-2">
                      <Icons.CheckCircle className="w-8 h-8 text-emerald-500/50" />
                      <p className="text-sm">Nenhum evento anômalo.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Overlay e Painel Lateral (Drawer) para o Serviço Selecionado */}
            {selectedService && (
              <>
                {/* Backdrop invisível para fechar */}
                <div className="fixed inset-0 z-40" onClick={() => setSelectedService(null)}></div>
                
                {/* Painel Lateral que desliza */}
                <div className="fixed top-0 right-0 h-full w-full max-w-sm glass-panel border-l border-slate-700/80 z-50 animate-slide-in shadow-2xl flex flex-col bg-slate-900/95 backdrop-blur-xl">
                  {/* Header do Drawer */}
                  <div className="p-6 border-b border-slate-700/50 flex justify-between items-start">
                    <div>
                      <div className="text-xs text-cyan-400 font-mono mb-1">{selectedService.id}</div>
                      <h2 className="text-xl font-bold text-white">{selectedService.name}</h2>
                      <p className="text-sm text-slate-400 uppercase tracking-wider mt-1">{selectedService.type} • {selectedService.region}</p>
                    </div>
                    <button onClick={() => setSelectedService(null)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-full transition-colors text-slate-400 hover:text-white">
                      <Icons.Close className="w-5 h-5" />
                    </button>
                  </div>

                  {/* Conteúdo do Drawer */}
                  <div className="p-6 flex-1 overflow-y-auto space-y-8">
                    
                    {/* Status Box */}
                    <div className="bg-slate-950/50 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                      <div>
                        <div className="text-slate-400 text-xs mb-1">Status Atual</div>
                        <StatusBadge status={selectedService.status} />
                      </div>
                      <div className="text-right">
                        <div className="text-slate-400 text-xs mb-1">Uptime SLA</div>
                        <div className="font-mono text-emerald-400 text-lg font-bold">{selectedService.uptime}</div>
                      </div>
                    </div>

                    {/* Telemetria (Barras Animadas) */}
                    <div>
                      <h3 className="text-sm font-semibold text-white mb-4 flex items-center gap-2"><Icons.Activity className="w-4 h-4 text-cyan-400" /> Telemetria em Tempo Real</h3>
                      <ProgressBar 
                        label="Consumo de CPU" 
                        value={selectedService.cpu} 
                        colorClass={selectedService.cpu > 80 ? 'bg-rose-500 shadow-[0_0_10px_#e11d48]' : selectedService.cpu > 60 ? 'bg-amber-500' : 'bg-cyan-500'} 
                      />
                      <ProgressBar 
                        label="Uso de Memória RAM" 
                        value={selectedService.ram} 
                        colorClass={selectedService.ram > 85 ? 'bg-rose-500 shadow-[0_0_10px_#e11d48]' : 'bg-indigo-500'} 
                      />
                      <ProgressBar 
                        label="Taxa de Latência de Rede" 
                        value={Math.min(100, Math.round((selectedService.latency / 400) * 100))} 
                        colorClass={selectedService.latency > 150 ? 'bg-rose-500' : 'bg-emerald-500'} 
                      />
                    </div>

                    {/* Informações Técnicas */}
                    <div className="bg-slate-900 p-4 rounded-lg text-xs font-mono text-slate-400 space-y-2 border border-slate-800">
                      <div className="flex justify-between"><span className="text-slate-500">IP Público:</span> <span>203.0.113.{Math.floor(Math.random()*255)}</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">Versão Kernel:</span> <span>Linux 5.15.0-aws</span></div>
                      <div className="flex justify-between"><span className="text-slate-500">Último Deploy:</span> <span>Há {Math.floor(Math.random()*12)+1} horas</span></div>
                    </div>
                  </div>

                  {/* Footer do Drawer (Ações) */}
                  <div className="p-6 border-t border-slate-700/50 bg-slate-950/80">
                    <button 
                      onClick={() => handleRestartService(selectedService.id)}
                      className="w-full flex items-center justify-center gap-2 py-3 bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 text-white rounded-xl font-medium transition-all shadow-lg shadow-cyan-900/50 active:scale-[0.98]"
                    >
                      <Icons.Refresh className="w-5 h-5" /> 
                      Executar Hard Restart
                    </button>
                    <button onClick={() => setSelectedService(null)} className="w-full mt-3 py-2 text-slate-400 hover:text-white text-sm transition-colors">
                      Fechar Detalhes
                    </button>
                  </div>
                </div>
              </>
            )}
            
          </div>

          {/* Toasts (Notificações Flutuantes) */}
          <div className="fixed bottom-6 right-6 z-[60] flex flex-col gap-3 pointer-events-none">
            {toasts.map(toast => (
              <div key={toast.id} className="animate-slide-in pointer-events-auto flex items-center gap-3 bg-slate-800 border border-slate-700 p-4 rounded-xl shadow-2xl max-w-sm">
                <div className={`p-2 rounded-full ${toast.type === 'success' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-cyan-500/20 text-cyan-400'}`}>
                  {toast.type === 'success' ? <Icons.CheckCircle className="w-5 h-5" /> : <Icons.Activity className="w-5 h-5" />}
                </div>
                <p className="text-sm font-medium text-slate-200">{toast.message}</p>
              </div>
            ))}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OmniWatchApp />);
  </script>
</body>
</html>
